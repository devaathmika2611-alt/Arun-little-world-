
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A Letter For You ❤️</title>

<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;500;600;700&family=Cormorant+Garamond:wght@500;600;700&display=swap" rel="stylesheet">

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 35px 12px;
  background:
    radial-gradient(ellipse at top, #65442e, #241711 75%);
  color: #4b3020;
  font-family: 'Cormorant Garamond', serif;
}

.scene {
  max-width: 850px;
  margin: auto;
}

.heading {
  text-align: center;
  color: #e5c48c;
  margin-bottom: 28px;
}

.heading .ornament {
  font-size: 30px;
  color: #c69b58;
}

.heading h1 {
  font-family: 'Cormorant Garamond', serif;
  font-size: 36px;
  font-weight: 600;
  letter-spacing: 2px;
  margin: 8px 0;
}

.heading p {
  font-style: italic;
  letter-spacing: 3px;
  font-size: 13px;
  color: #c9a979;
}

.frame {
  padding: 12px;
  background: linear-gradient(135deg,
    #6c4828, #d4b16d, #704b2b, #d8bd83);
  border-radius: 4px;
  box-shadow: 0 18px 55px #0009;
}

.paper {
  position: relative;
  padding: 45px 34px;
  background:
    radial-gradient(ellipse at 10% 15%, #fff4d4aa, transparent 40%),
    radial-gradient(ellipse at 90% 85%, #b18a5144, transparent 45%),
    linear-gradient(120deg, #f1dfbd, #e5cfaa, #f4e5c8);
  border: 3px double #956c3d;
  outline: 1px solid #b28b54;
  outline-offset: -11px;
}

.paper::before {
  content: "❦";
  position: absolute;
  top: 12px;
  left: 20px;
  font-size: 27px;
  color: #a47b46;
}

.paper::after {
  content: "❦";
  position: absolute;
  bottom: 12px;
  right: 20px;
  font-size: 27px;
  color: #a47b46;
}

.inner {
  border: 1px solid #b18a56;
  padding: 25px 22px;
}

.top {
  text-align: center;
  color: #956d3c;
  font-size: 30px;
  margin-bottom: 5px;
}

.title {
  text-align: center;
  font-size: 34px;
  color: #674126;
  font-weight: 600;
  font-style: italic;
  margin: 0;
}

.subtitle {
  text-align: center;
  font-size: 17px;
  letter-spacing: 2px;
  color: #987044;
  margin: 8px 0 28px;
}

.letter {
  font-family: 'Caveat', cursive;
  font-size: 23px;
  font-weight: 500;
  line-height: 1.5;
  color: #39271d;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}

.seal {
  width: 75px;
  height: 75px;
  margin: 35px auto 5px;
  border-radius: 50%;
  display: flex;
  justify-content: center;
  align-items: center;
  background: radial-gradient(circle at 35% 30%,
    #a74646, #6d171e 75%);
  color: #eacb91;
  font-size: 34px;
  box-shadow: 0 5px 12px #58301d77;
  border: 3px solid #8a3431;
}

.bottom {
  text-align: center;
  color: #956b3c;
  font-size: 26px;
  margin-top: 15px;
}

.end {
  text-align: center;
  color: #e3c28d;
  margin-top: 25px;
  font-size: 13px;
  letter-spacing: 3px;
}

@media(max-width:500px) {
  body {
    padding: 20px 7px;
  }

  .frame {
    padding: 7px;
  }

  .paper {
    padding: 32px 17px;
  }

  .inner {
    padding: 23px 13px;
  }

  .letter {
    font-size: 21px;
    line-height: 1.45;
  }

  .title {
    font-size: 28px;
  }

  .heading h1 {
    font-size: 29px;
  }
}
</style>
</head>

<body>
