
<!DOCTYPE html>
<html lang="en">
<head>

<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;500;600;700&family=Cormorant+Garamond:wght@500;600;700&display=swap" rel="stylesheet">

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 30px 10px;
  background: radial-gradient(ellipse at 50% 20%, #795239, #24140f 80%);
  color: #4b3020;
  font-family: 'Cormorant Garamond', serif;
}

.scene {
  max-width: 850px;
  margin: auto;
}

.heading {
  text-align: center;
  color: #e9c98d;
  margin-bottom: 30px;
}

.heading .ornament {
  color: #d7ad65;
  font-size: 38px;
}

.heading h1 {
  font-size: 36px;
  font-weight: 600;
  letter-spacing: 3px;
  margin: 8px 0;
  text-shadow: 0 2px 12px #c18a45aa;
}

.heading p {
  font-style: italic;
  letter-spacing: 3px;
  font-size: 13px;
  color: #c9a979;
}

.frame {
  padding: 14px;
  background: linear-gradient(135deg,
    #55351f, #e1bd75, #79502b, #f0d79b, #55351f);
  box-shadow: 0 20px 50px #000a, 0 0 25px #c49a5a55;
  border-radius: 5px;
}

.paper {
  position: relative;
  padding: 40px 25px;
  background:
    radial-gradient(circle at 0% 0%, #fff5d588, transparent 35%),
    radial-gradient(circle at 100% 100%, #a77c4844, transparent 40%),
    repeating-linear-gradient(
      0deg,
      #e8d3ad08 0px,
      #e8d3ad08 2px,
      transparent 2px,
      transparent 5px
    ),
    linear-gradient(135deg, #f1dfbd, #dfc398, #f5e5c5);
  border: 5px double #93652e;
  outline: 2px solid #bd965a;
  outline-offset: -13px;
  box-shadow: inset 0 0 35px #99704455;
}

.paper::before {
  content: "❦";
  position: absolute;
  top: 12px;
  left: 20px;
  color: #96652e;
  font-size: 35px;
}

.paper::after {
  content: "❦";
  position: absolute;
  bottom: 12px;
  right: 20px;
  color: #96652e;
  font-size: 35px;
}

.inner {
  border: 2px solid #a67a43;
  outline: 1px solid #c6a36b;
  outline-offset: 5px;
  padding: 30px 22px;
}

.top {
  text-align: center;
  color: #93652e;
  font-size: 36px;
  margin-bottom: 5px;
}

.title {
  text-align: center;
  color: #59351f;
  font-size: 38px;
  font-weight: 600;
  font-style: italic;
  margin: 0;
  text-shadow: 0 2px 3px #b68a5555;
}

.subtitle {
  text-align: center;
  color: #987044;
  font-size: 17px;
  letter-spacing: 3px;
  margin: 8px 0 28px;
}

.letter {
  font-family: 'Caveat', cursive;
  font-size: 23px;
  font-weight: 500;
  line-height: 1.45;
  color: #382419;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}

.seal {
  width: 88px;
  height: 88px;
  margin: 35px auto 5px;
  border-radius: 50%;
  display: flex;
  justify-content: center;
  align-items: center;
  background: radial-gradient(circle at 35% 25%,
    #c15b52, #801b26 65%, #4c1019);
  color: #eacb91;
  font-size: 34px;
  border: 4px solid #a54a3e;
  box-shadow: 0 5px 12px #39201488,
              inset 0 0 8px #e8a18b66;
}

.bottom {
  text-align: center;
  color: #93652e;
  font-size: 32px;
  margin-top: 15px;
}

.end {
  text-align: center;
  color: #e3c28d;
  margin-top: 25px;
  font-size: 13px;
  letter-spacing: 3px;
}

@media(max-width:500px) {
  body {
    padding: 20px 7px;
  }

  .heading h1 {
    font-size: 29px;
  }

  .frame {
    padding: 8px;
  }

  .paper {
    padding: 32px 16px;
  }

  .inner {
    padding: 25px 13px;
  }

  .title {
    font-size: 29px;
  }

  .letter {
    font-size: 20px;
    line-height: 1.4;
  }
}
</style>
</head>
