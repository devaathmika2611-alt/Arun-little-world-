
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thank You ❤️</title>

<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600;700&family=Cormorant+Garamond:wght@500;600;700&display=swap" rel="stylesheet">

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 25px;
  background: radial-gradient(circle at top, #39306b, #17132f 75%);
  color: #ffe4b5;
  font-family: 'Cormorant Garamond', serif;
}

.closing {
  max-width: 600px;
  animation: appear 1.5s ease;
}

@keyframes appear {
  from { opacity: 0; transform: translateY(30px); }
  to { opacity: 1; transform: translateY(0); }
}

.stars {
  font-size: 35px;
  margin-bottom: 25px;
}

h1 {
  font-size: 48px;
  font-style: italic;
  color: #ffdfaa;
}

p {
  font-family: 'Caveat', cursive;
  font-size: 28px;
  line-height: 1.5;
}

.heart {
  font-size: 45px;
  margin: 25px;
  animation: beat 1.5s infinite;
}

@keyframes beat {
  50% { transform: scale(1.2); }
}

a {
  display: inline-block;
  margin-top: 20px;
  padding: 13px 28px;
  border-radius: 30px;
  background: linear-gradient(135deg,#ffdfaa,#e99abb);
  color: #55223f;
  text-decoration: none;
  font-size: 18px;
}

.footer {
  margin-top: 45px;
  letter-spacing: 3px;
  font-size: 12px;
}

@media(max-width:500px) {
  h1 { font-size: 37px; }
}
</style>
</head>

<body>

<div class="closing">

  <div class="stars">✧ 🌙 ✧</div>

  <h1>Thank You for Watching ♡</h1>

  <p>
    Hope this little world<br>
    made you smile. 🥹
    <br><br>
    Every little moment here<br>
    was made with love.
  </p>

  <div class="heart">💗</div>

  <a href="index.html">Back to Beginning ↗</a>

  <div class="footer">
    MADE WITH LOVE · FOREVER & ALWAYS
  </div>

</div>

</body>
</html>
