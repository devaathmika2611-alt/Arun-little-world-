
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A Little Surprise ❤️</title>

<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;500;600;700&family=Cormorant+Garamond:wght@500;600;700&display=swap" rel="stylesheet">

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  padding: 30px 15px;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  background: radial-gradient(ellipse at top, #651b25, #26070d 75%);
  color: #f3d18c;
  font-family: 'Cormorant Garamond', serif;
}

.container {
  max-width: 600px;
  width: 100%;
}

.ornament {
  font-size: 38px;
  color: #e8bd70;
}

h1 {
  font-size: 42px;
  font-style: italic;
  color: #f3d18c;
}

.subtitle {
  font-size: 19px;
  letter-spacing: 3px;
  color: #e4c18a;
}

.gift {
  position: relative;
  width: 190px;
  height: 155px;
  margin: 80px auto 45px;
  cursor: pointer;
  animation: float 2s infinite ease-in-out;
}

.box {
  position: absolute;
  bottom: 0;
  width: 190px;
  height: 120px;
  background: linear-gradient(135deg, #c18a3e, #8b2635);
  border: 3px solid #f0cf91;
  border-radius: 5px;
}

.box::before {
  content: "";
  position: absolute;
  width: 28px;
  height: 100%;
  left: 78px;
  background: #f4d18b;
}

.lid {
  position: absolute;
  top: 20px;
  left: -10px;
  width: 210px;
  height: 35px;
  background: linear-gradient(135deg, #e3b86c, #9b3540);
  border: 3px solid #f8dda7;
  border-radius: 5px;
  transition: 0.8s;
  z-index: 2;
}

.lid::before {
  content: "";
  position: absolute;
  width: 28px;
  height: 100%;
  left: 88px;
  background: #f4d18b;
}

.bow {
  position: absolute;
  top: -18px;
  left: 68px;
  font-size: 55px;
  z-index: 3;
  transition: 0.8s;
}

.gift.open .lid {
  transform: translateY(-100px) rotate(-15deg);
}

.gift.open .bow {
  transform: translateY(-100px) rotate(-15deg);
}

@keyframes float {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-12px); }
}

.open-btn {
  padding: 14px 32px;
  border: 2px solid #f8dda7;
  border-radius: 35px;
  background: linear-gradient(135deg, #f3d18c, #bd843b);
  color: #4b1720;
  font-size: 19px;
  font-weight: bold;
  font-family: inherit;
  cursor: pointer;
}

.message {
  display: none;
  margin: 35px auto 0;
  padding: 28px 20px;
  max-width: 480px;
  background: linear-gradient(135deg, #f6dfb2, #d9ad70);
  color: #54251a;
  border: 5px double #8d4c20;
  box-shadow: 0 10px 35px #0008;
  animation: appear 1s ease;
}

.message h2 {
  font-size: 32px;
  font-style: italic;
}

.message p {
  font-family: 'Caveat', cursive;
  font-size: 25px;
}

.message.show {
  display: block;
}

@keyframes appear {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}

.footer {
  margin-top: 40px;
  letter-spacing: 3px;
  font-size: 13px;
}
</style>
</head>

<body>

<div class="container">

  <div class="ornament">✧ ❦ ✧</div>

  <h1>A Little Surprise For You</h1>

  <div class="subtitle">MADE WITH LOVE ♡</div>

  <div class="gift" id="gift">
    <div class="bow">🎀</div>
    <div class="lid"></div>
    <div class="box"></div>
  </div>

  <button class="open-btn" onclick="openGift()">
    Open Your Gift 🎁
  </button>

  <div class="message" id="message">
    <h2>Surprise, My Favourite Person! ❤️</h2>
    <p>
      You are my favourite gift in this life.
      <br>
      Thank you for being a part of my world.
      <br>
      Love you forever! 💗
    </p>
    <div style="font-size:35px;">💝</div>
  </div>

  <div class="footer">
    FOREVER & ALWAYS · WITH LOVE
  </div>

</div>

<script>
function openGift() {
  document.getElementById("gift").classList.add("open");
  document.getElementById("message").classList.add("show");

  document.querySelector(".open-btn").textContent =
    "Surprise Opened ❤️";
}
</script>

</body>
</html>
