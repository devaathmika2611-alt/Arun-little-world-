
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Our Little Surprise ❤️</title>

<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600;700&family=Cormorant+Garamond:wght@500;600;700&display=swap" rel="stylesheet">

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  background: radial-gradient(circle at top, #39306b, #17132f 75%);
  color: #ffe4b5;
  font-family: 'Cormorant Garamond', serif;
  text-align: center;
  padding: 35px 15px;
  overflow-x: hidden;
}

.container {
  max-width: 650px;
  margin: auto;
}

h1 {
  font-size: 40px;
  font-style: italic;
  color: #ffdfaa;
}

.subtitle {
  letter-spacing: 4px;
  font-size: 14px;
}

.gift {
  position: relative;
  width: 180px;
  height: 150px;
  margin: 100px auto 40px;
  cursor: pointer;
  animation: float 2s infinite ease-in-out;
}

.box {
  position: absolute;
  bottom: 0;
  width: 180px;
  height: 115px;
  background: linear-gradient(135deg,#f0a1b9,#a83c75);
  border: 3px solid #ffe1a8;
  border-radius: 7px;
}

.box:after {
  content: "";
  position: absolute;
  left: 75px;
  width: 25px;
  height: 100%;
  background: #ffe1a8;
}

.lid {
  position: absolute;
  top: 25px;
  left: -10px;
  width: 200px;
  height: 32px;
  background: #e9a2bd;
  border: 3px solid #ffe1a8;
  border-radius: 5px;
  z-index: 2;
  transition: .8s;
}

.bow {
  position: absolute;
  top: -20px;
  left: 65px;
  font-size: 48px;
  z-index: 3;
  transition: .8s;
}

.gift.open .lid {
  transform: translateY(-100px) rotate(-15deg);
}

.gift.open .bow {
  transform: translateY(-100px) rotate(-15deg);
}

.open-btn {
  padding: 14px 30px;
  border: 2px solid #ffe1a8;
  border-radius: 30px;
  background: linear-gradient(135deg,#ffdfaa,#e99abb);
  color: #55223f;
  font-size: 19px;
  font-weight: bold;
  font-family: inherit;
  cursor: pointer;
}

.stickers {
  display: none;
  position: relative;
  margin: 35px auto;
  max-width: 480px;
  min-height: 180px;
}

.stickers.show {
  display: block;
}

.sticker {
  display: inline-block;
  font-size: 48px;
  margin: 10px;
  animation: pop .7s both, bounce 2s infinite ease-in-out;
}

.sticker:nth-child(2) { animation-delay: .2s; }
.sticker:nth-child(3) { animation-delay: .4s; }
.sticker:nth-child(4) { animation-delay: .6s; }
.sticker:nth-child(5) { animation-delay: .8s; }
.sticker:nth-child(6) { animation-delay: 1s; }

@keyframes pop {
  from { opacity: 0; transform: scale(0) rotate(-30deg); }
  to { opacity: 1; transform: scale(1) rotate(0); }
}

@keyframes bounce {
  0%,100% { translate: 0 0; }
  50% { translate: 0 -10px; }
}

@keyframes float {
  0%,100% { transform: translateY(0); }
  50% { transform: translateY(-12px); }
}

.message {
  display: none;
  padding: 25px 20px;
  margin: 25px auto;
  max-width: 480px;
  background: linear-gradient(135deg,#fff0d0,#e9b6c9);
  color: #582442;
  border: 4px double #a45a76;
  border-radius: 12px;
  box-shadow: 0 10px 30px #0006;
  animation: pop .8s both;
}

.message.show { display: block; }

.message h2 {
  font-size: 32px;
  font-style: italic;
}

.message p {
  font-family: 'Caveat', cursive;
  font-size: 25px;
  line-height: 1.4;
}

.footer {
  margin-top: 35px;
  letter-spacing: 3px;
  font-size: 13px;
}

@media(max-width:500px) {
  h1 { font-size: 32px; }
  .sticker { font-size: 40px; }
}
</style>
</head>

<body>
<div class="container">

  <div style="font-size:35px;">✧ 🌙 ✧</div>
  <h1>A Little Surprise For You</h1>
  <div class="subtitle">A WORLD FULL OF LITTLE LOVE ♡</div>

  <div class="gift" id="gift">
    <div class="bow">🎀</div>
    <div class="lid"></div>
    <div class="box"></div>
  </div>

  <button class="open-btn" id="openBtn" onclick="openGift()">
    Open Your Gift 🎁
  </button>

  <div class="stickers" id="stickers">
    <div class="sticker">💗</div>
    <div class="sticker">🧸</div>
    <div class="sticker">🦋</div>
    <div class="sticker">😘</div>
    <div class="sticker">🥰</div>
    <div class="sticker">💞</div>
    <div class="sticker">🐻</div>
    <div class="sticker">💕</div>
  </div>

  <div class="message" id="message">
    <h2>Surprise, My Favourite Person! ❤️</h2>
    <p>
      You are my favourite gift in this life.
      <br>
      Thank you for being a part of my world.
      <br>
      Love you forever! 💗
    </p>
    <div style="font-size:35px;">💝</div>
  </div>

  <div class="footer">FOREVER & ALWAYS · WITH LOVE</div>

</div>

<script>
function openGift() {
  document.getElementById("gift").classList.add("open");
  document.getElementById("stickers").classList.add("show");
  document.getElementById("message").classList.add("show");
  document.getElementById("openBtn").textContent = "Your Surprise Is Opened ❤️";
  document.getElementById("openBtn").disabled = true;
}
</script>
</body>
</html>
